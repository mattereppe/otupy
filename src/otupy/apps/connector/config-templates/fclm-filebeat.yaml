fclm-packetbeat-example:
  actuator: "fclm-filebeat"
  profile: "x-fclm"
  owner: "acme.com"
  specifiers:
    domain: null
    asset_id: "fclm-filebeat-example"
  probe:
    executable: "/usr/share/filebeat/bin/filebeat" # WARNING: /usr/bin/filebeat is a wrapper!!! DO NOT USE
    info_elements: null
    base_config: null
    path_home: "beat"
    path_data: "filebeat-data"
    path_logs: "filebeat-log"
    path_config: "filebeat-config"
    capabilities:
      agent: "filebeat"
      imports_config:
        - "file"
        - "uri"
        - "socket"
      exports_config:
        - "file"
      import_controls:
        - "scan_frequency"
        - "backoff"
        - "max_backoff"
        - "close_inactive"
        - "ignore_older"
