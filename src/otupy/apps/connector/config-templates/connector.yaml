id: connector@mirandaproject.eu			# OpenC2 identifier for the Consumer
consumer:										# Communication stack configuration
   host: '127.0.0.1'							# IP address to listen to (also reported when necessary to the Producer)
   port: 8080									# TCP port to bind to
   endpoint: "/.well-known/openc2"		# Endpoint (should not be changed)
   encoding: "json"							# Serialization format (default to json)
   transfer: "http"							# Transfer protocol (default to https)
configs: "configs"							# Config folder with actuator-specific configuration files

logger:											# Logging framework configuration. See the documentation
   version: 1
   disable_existing_loggers: false     # (Default: true) This is necessary to enable logging for all imported module
   formatters:
      otupy:
         (): otupy.LogFormatter
         datetime: True
         name: True
      otupy2file:
         (): otupy.LogFormatter
         datetime: True
         name: True
         datefmt: "%t"
   handlers:
      console:
         class: logging.StreamHandler
         formatter: otupy
         level: INFO
         filters: Null
      file:
         class: logging.FileHandler
         formatter: otupy2file
         level: DEBUG
         filters: Null
         filename: "connector.log"
   root:
      handlers: [console, file]
      level: INFO
   loggers:
      otupy:                      # This is a better configuration (does not required disabled_existing_loggers: true)
         handlers: [console]      # because it only enables logging for the otupy modele (DEBUG level in this case)
         level: DEBUG             # and does not overwhelm the output with useless logs from other modules.
