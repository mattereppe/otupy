logger:
   version: 1
   formatters:
      otupy:
         (): otupy.LogFormatter
         datetime: True
         name: True
   handlers:
      console:
         class: logging.StreamHandler
         formatter: otupy
         level: DEBUG
         filters: Null
      file:
         class: logging.FileHandler
         formatter: otupy
         level: INFO
         filters: Null
         filename: "discovery.log"
