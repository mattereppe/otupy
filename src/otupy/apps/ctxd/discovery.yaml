frequency: 10 # seconds
loop: 1 # -1: forever, 0: no run, >0: number of runs
services:
  - host: '127.0.0.1'
    port: 8080
    endpoint: "/.well-known/openc2"
    encoding: "json"
    transfer: "http"
    actuator:
      asset_id: "ctxd-kubernetes-example"
  - host: '127.0.0.1'
    port: 8080
    actuator:
      asset_id: "ctxd-openstack-example"
