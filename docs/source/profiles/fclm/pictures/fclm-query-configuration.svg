<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990" role="img" aria-labelledby="title desc">
  <title id="title">Example graphical interface for configuring an FCLM log monitor</title>
  <desc id="desc">A configuration screen showing a file source, import controls, selected export fields, a collector output destination, and a Start monitor button.</desc>
  <style>
    .bg{fill:#f4f7fb}.window{fill:#fff;stroke:#d9e2ef;stroke-width:1.5}.panel{fill:#fff;stroke:#d9e2ef;stroke-width:1.3}.subtle{fill:#f7f9fc}.field{fill:#fff;stroke:#cbd7e7;stroke-width:1.2}.blue{fill:#1769e0}.blueSoft{fill:#e9f2ff;stroke:#b9d4ff;stroke-width:1}.text{fill:#172033;font-family:Arial,sans-serif}.muted{fill:#64748b;font-family:Arial,sans-serif}.blueText{fill:#1769e0;font-family:Arial,sans-serif}.white{fill:#fff;font-family:Arial,sans-serif}.line{stroke:#d9e2ef;stroke-width:1}.bold{font-weight:700}.small{font-size:14px}.tiny{font-size:12px}.label{font-size:13px;font-weight:700}.title{font-size:32px;font-weight:700}.section{font-size:17px;font-weight:700}.chip{fill:#e9f2ff;stroke:#b9d4ff;stroke-width:1}.note{fill:#f7f9fc;stroke:#d9e2ef;stroke-width:1}.green{fill:#0b7a54}
  </style>
  <rect class="bg" x="0" y="0" width="1400" height="990"/>
  <rect class="window" x="55" y="35" width="1290" height="920" rx="18"/>
  <line class="line" x1="55" y1="105" x2="1345" y2="105"/>
  <rect class="blue" x="83" y="57" width="32" height="32" rx="9"/>
  <text class="white bold small" x="91" y="78">OC</text>
  <text class="text bold" x="128" y="78" font-size="17">OpenC2 Consumer</text>
  <circle class="green" cx="945" cy="73" r="5"/>
  <text class="muted small" x="957" y="78">Connected to 172.17.0.11:8080 · fclm-filebeat</text>
  <text class="blueText bold tiny" x="92" y="151" letter-spacing="1.5">FCLM · START MONITOR</text>
  <text class="text title" x="92" y="193">Configure a log monitor</text>
  <text class="muted small" x="92" y="221">Build a Start command from the options exposed by the selected FCLM actuator.</text>
  <text class="muted small" x="92" y="243">Source, controls, fields, and destination are all request inputs.</text>
  <rect class="panel" x="92" y="274" width="700" height="245" rx="13"/>
  <text class="text section" x="115" y="310">Log source</text>
  <text class="muted tiny" x="115" y="332">Select a monitor representation advertised by the actuator.</text>
  <rect class="blueSoft" x="690" y="295" width="76" height="24" rx="12"/>
  <text class="blueText bold tiny" x="706" y="311">REQUIRED</text>
  <rect class="subtle" x="115" y="353" width="654" height="45" rx="9"/>
  <rect class="window" x="120" y="358" width="207" height="35" rx="7"/>
  <rect class="blueSoft" x="120" y="358" width="207" height="35" rx="7"/>
  <text class="blueText bold small" x="207" y="381">File</text>
  <text class="muted bold small" x="437" y="381">URI</text>
  <text class="muted bold small" x="638" y="381">Socket</text>
  <text class="text label" x="115" y="426">File path</text>
  <rect class="field" x="115" y="438" width="654" height="46" rx="8"/>
  <text class="text small" x="129" y="467">/var/log/http_access.log</text>
  <rect class="panel" x="92" y="539" width="700" height="300" rx="13"/>
  <text class="text section" x="115" y="575">Import controls</text>
  <text class="muted tiny" x="115" y="597">Optional timing and lifecycle settings passed in import_controls.</text>
  <rect class="blueSoft" x="687" y="560" width="79" height="24" rx="12"/>
  <text class="blueText bold tiny" x="704" y="576">OPTIONAL</text>
  <text class="text label" x="115" y="637">Scan frequency  <tspan class="muted" font-size="10">seconds</tspan></text>
  <text class="text label" x="451" y="637">Max backoff  <tspan class="muted" font-size="10">seconds</tspan></text>
  <rect class="field" x="115" y="650" width="310" height="46" rx="8"/>
  <rect class="field" x="451" y="650" width="318" height="46" rx="8"/>
  <text class="text small" x="129" y="679">10</text>
  <text class="text small" x="465" y="679">10</text>
  <text class="muted tiny" x="115" y="734">Other advertised choices: backoff, close inactive, and ignore older.</text>
  <rect class="panel" x="812" y="274" width="510" height="268" rx="13"/>
  <text class="text section" x="835" y="310">Export fields</text>
  <text class="muted tiny" x="835" y="332">Choose the fields to send to the configured exporter.</text>
  <rect class="blueSoft" x="1191" y="295" width="105" height="24" rx="12"/>
  <text class="blueText bold tiny" x="1205" y="311">MULTI-SELECT</text>
  <rect class="chip" x="835" y="359" width="91" height="31" rx="15"/><text class="blueText bold tiny" x="849" y="379">Timestamp ×</text>
  <rect class="chip" x="935" y="359" width="86" height="31" rx="15"/><text class="blueText bold tiny" x="949" y="379">Metadata ×</text>
  <rect class="chip" x="1031" y="359" width="86" height="31" rx="15"/><text class="blueText bold tiny" x="1045" y="379">Message ×</text>
  <rect class="chip" x="835" y="401" width="112" height="31" rx="15"/><text class="blueText bold tiny" x="849" y="421">Log file path ×</text>
  <rect class="chip" x="956" y="401" width="88" height="31" rx="15"/><text class="blueText bold tiny" x="970" y="421">Input type ×</text>
  <line class="line" x1="835" y1="462" x2="1297" y2="462"/>
  <text class="muted tiny" x="835" y="491">54 fields available</text>
  <text class="blueText bold tiny" x="1198" y="491">+ Select fields</text>
  <rect class="panel" x="812" y="562" width="510" height="300" rx="13"/>
  <text class="text section" x="835" y="598">Output destination</text>
  <text class="muted tiny" x="835" y="620">Set the exporter object for the selected monitor.</text>
  <rect class="blueSoft" x="1220" y="583" width="76" height="24" rx="12"/>
  <text class="blueText bold tiny" x="1236" y="599">REQUIRED</text>
  <rect class="blueSoft" x="835" y="643" width="220" height="47" rx="9"/>
  <text class="blueText bold small" x="908" y="672">Collector</text>
  <rect class="subtle" x="1065" y="643" width="232" height="47" rx="9"/>
  <text class="muted bold small" x="1140" y="672">Local file</text>
  <text class="text label" x="835" y="724">Collector host</text>
  <text class="text label" x="1084" y="724">Port</text>
  <rect class="field" x="835" y="737" width="231" height="45" rx="8"/><text class="text small" x="849" y="765">127.0.0.1</text>
  <rect class="field" x="1084" y="737" width="213" height="45" rx="8"/><text class="text small" x="1098" y="765">1234</text>
  <text class="text label" x="835" y="810">Format</text>
  <rect class="field" x="835" y="821" width="462" height="29" rx="7"/>
  <text class="text tiny" x="849" y="841">JSON</text><text class="muted tiny" x="1273" y="841">⌄</text>
  <line class="line" x1="92" y1="885" x2="1322" y2="885"/>
  <text class="muted tiny" x="92" y="914">The Start response returns a monitor identifier. Keep it to issue a later Stop command.</text>
  <rect class="blue" x="1173" y="899" width="149" height="45" rx="9"/>
  <text class="white bold small" x="1207" y="927">Start monitor</text>
</svg>
