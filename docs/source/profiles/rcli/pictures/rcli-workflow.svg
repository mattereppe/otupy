<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">RCLI operational workflow</title>
  <desc id="desc">A Producer queries capabilities, optionally copies an artifact, starts and queries processes, stops them, and optionally deletes stored files on an RCLI Consumer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5b89"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #183247; }
      .lane-title { font: 700 21px sans-serif; fill: #ffffff; }
      .step-title { font: 700 17px sans-serif; fill: #183247; }
      .step-text { font: 15px sans-serif; fill: #324b5c; }
      .message { font: 600 15px sans-serif; fill: #1f5b89; }
      .response { font: 14px sans-serif; fill: #5b6870; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="43" text-anchor="middle" class="title">Typical RCLI command workflow</text>

  <rect x="80" y="70" width="400" height="630" rx="18" fill="#e8f3fa" stroke="#b8d8ea" stroke-width="2"/>
  <rect x="720" y="70" width="400" height="630" rx="18" fill="#eef7ef" stroke="#c5dfc9" stroke-width="2"/>
  <rect x="80" y="70" width="400" height="58" rx="18" fill="#1f5b89"/>
  <rect x="720" y="70" width="400" height="58" rx="18" fill="#2d7b4c"/>
  <text x="280" y="107" text-anchor="middle" class="lane-title">OpenC2 Producer</text>
  <text x="920" y="107" text-anchor="middle" class="lane-title">RCLI Consumer</text>

  <g>
    <rect x="120" y="158" width="320" height="64" rx="10" fill="#ffffff" stroke="#b8d8ea"/>
    <text x="145" y="184" class="step-title">1. Discover capabilities</text>
    <text x="145" y="207" class="step-text">Request features and clicommands</text>
    <line x1="442" y1="184" x2="758" y2="184" stroke="#1f5b89" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="173" text-anchor="middle" class="message">query features</text>
    <text x="600" y="207" text-anchor="middle" class="response">capabilities response</text>
  </g>

  <g>
    <rect x="120" y="252" width="320" height="64" rx="10" fill="#ffffff" stroke="#b8d8ea"/>
    <text x="145" y="278" class="step-title">2. Transfer artifact</text>
    <text x="145" y="301" class="step-text">Optional script, file, or executable</text>
    <line x1="442" y1="278" x2="758" y2="278" stroke="#1f5b89" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="267" text-anchor="middle" class="message">copy artifact</text>
    <text x="600" y="301" text-anchor="middle" class="response">stored-file response</text>
  </g>

  <g>
    <rect x="120" y="346" width="320" height="64" rx="10" fill="#ffffff" stroke="#b8d8ea"/>
    <text x="145" y="372" class="step-title">3. Start process</text>
    <text x="145" y="395" class="step-text">Use an allowlisted command</text>
    <line x1="442" y1="372" x2="758" y2="372" stroke="#1f5b89" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="361" text-anchor="middle" class="message">start processes</text>
    <text x="600" y="395" text-anchor="middle" class="response">process-status response</text>
  </g>

  <g>
    <rect x="120" y="440" width="320" height="64" rx="10" fill="#ffffff" stroke="#b8d8ea"/>
    <text x="145" y="466" class="step-title">4. Inspect process state</text>
    <text x="145" y="489" class="step-text">Check tracked process identifiers</text>
    <line x1="442" y1="466" x2="758" y2="466" stroke="#1f5b89" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="455" text-anchor="middle" class="message">query processes</text>
    <text x="600" y="489" text-anchor="middle" class="response">state response</text>
  </g>

  <g>
    <rect x="120" y="534" width="320" height="64" rx="10" fill="#ffffff" stroke="#b8d8ea"/>
    <text x="145" y="560" class="step-title">5. Stop process</text>
    <text x="145" y="583" class="step-text">Terminate selected or tracked processes</text>
    <line x1="442" y1="560" x2="758" y2="560" stroke="#1f5b89" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="549" text-anchor="middle" class="message">stop processes</text>
    <text x="600" y="583" text-anchor="middle" class="response">termination response</text>
  </g>

  <g>
    <rect x="120" y="628" width="320" height="48" rx="10" fill="#ffffff" stroke="#b8d8ea"/>
    <text x="145" y="658" class="step-title">6. Remove artifacts (optional)</text>
    <line x1="442" y1="652" x2="758" y2="652" stroke="#1f5b89" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="641" text-anchor="middle" class="message">delete files</text>
    <text x="600" y="675" text-anchor="middle" class="response">cleanup response</text>
  </g>
</svg>
